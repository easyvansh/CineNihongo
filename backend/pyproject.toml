[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinenihongo-backend"
version = "1.2.0"
description = "Local Japanese transcription service for CineNihongo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "numpy>=1.26,<3",
  "faster-whisper>=1.1,<2",
  "sudachipy>=0.6.8,<1",
  "pykakasi>=2.3,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.7,<1", "mypy>=1.12,<2"]
full-dictionary = ["sudachidict-small>=20240716"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sudachipy", "sudachipy.*"]
ignore_missing_imports = true
follow_imports = "skip"
