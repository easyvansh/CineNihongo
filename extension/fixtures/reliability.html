<!doctype html>
<html lang="en"><meta charset="utf-8"><title>CineNihongo reliability fixtures</title>
<style>body{margin:0;background:#111;color:white;font:16px system-ui}.stage{position:relative;width:800px;height:450px;margin:20px}video{width:800px;height:450px;background:#172033}.caption{position:absolute;bottom:35px;left:100px;width:600px;height:40px;text-align:center}.stage:fullscreen{width:100vw;height:100vh}.stage:fullscreen video{width:100%;height:100%}</style>
<div class="stage"><video controls></video><div class="caption">English fixture cue</div></div>
<script>
  // Real seekable media: main-world property mocks are invisible to isolated content scripts.
  const data = new ArrayBuffer(44 + 16000 * 2 * 60); const view = new DataView(data);
  function ascii(offset, text) { [...text].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0))); }
  ascii(0, 'RIFF'); view.setUint32(4, data.byteLength - 8, true); ascii(8, 'WAVE');
  ascii(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, 16000, true); view.setUint32(28, 32000, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  ascii(36, 'data'); view.setUint32(40, data.byteLength - 44, true);
  for (let i = 0; i < 16000 * 60; i++) view.setInt16(44 + i * 2, Math.sin(i * 2 * Math.PI * 440 / 16000) * 1500, true);
  const media = URL.createObjectURL(new Blob([data], { type: 'audio/wav' }));
  window.fixture = {
    get time() { return document.querySelector('.stage video').currentTime; },
    set time(value) { document.querySelector('.stage video').currentTime = value; },
    replaceVideo() { const video = document.createElement('video'); document.querySelector('.stage video').replaceWith(video); video.src = media; }
  };
  document.querySelector('video').src = media;
</script></html>
